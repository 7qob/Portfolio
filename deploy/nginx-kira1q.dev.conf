# nginx server block for kira1q.dev
#
# Install on the Pi as:
#   /etc/nginx/sites-available/kira1q.dev
# then:
#   sudo ln -sf /etc/nginx/sites-available/kira1q.dev /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is NOT configured here on purpose. Cloudflare Tunnel terminates HTTPS at
# Cloudflare's edge and connects to this server over the loopback interface, so
# a certificate on the Pi would be redundant. Nothing is exposed to the
# internet directly — no port forwarding, no open 80/443 on your router.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name kira1q.dev www.kira1q.dev _;

    root /var/www/kira1q.dev;
    index index.html;

    # Static site: serve the file, otherwise the pretty URL, otherwise 404.
    # No SPA-style fallback to index.html — a typo'd URL should 404, not
    # silently render the home page.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- Private vault ---------------------------------------------------
    # HTTP Basic Auth over the Cloudflare Tunnel. Everything under /vault/ —
    # the listing page AND the documents it links to — is behind one gate.
    #
    # Create the password file ON THE PI. It is never in the repo:
    #     sudo htpasswd -B -c /etc/nginx/.htpasswd-vault <username>
    #     sudo chown root:www-data /etc/nginx/.htpasswd-vault
    #     sudo chmod 640 /etc/nginx/.htpasswd-vault
    # (-B = bcrypt. Without it htpasswd defaults to MD5, which is not a
    # password hash. -c CREATES the file — omit it to add a second user, or
    # you will overwrite the first one.)
    #
    # If the file is missing, nginx answers 500 for this location. That is
    # fail-closed and correct: a config mistake must never open the vault.

    # /vault -> /vault/ so the prefix block below always gets the request.
    location = /vault { return 301 /vault/; }

    location ^~ /vault/ {
        # ^~ is load-bearing, not decoration. With a plain `location /vault/`
        # the regex block `location ~* \.html$` further down would win for
        # /vault/index.html — regex locations outrank ordinary prefixes — and
        # the page would be served with NO authentication at all. ^~ makes
        # this the winning prefix AND tells nginx to skip regexes entirely.
        auth_basic           "Vault";
        auth_basic_user_file /etc/nginx/.htpasswd-vault;

        # Cancelling the credential dialog must not dump the visitor on
        # nginx's white default error page. nginx keeps the 401 status and
        # the WWW-Authenticate header through this internal redirect, so the
        # dialog still comes first; vault-locked.html is only what you see if
        # you dismiss it. It lives at the site root deliberately — inside
        # /vault/ it would need auth to render, which is a redirect loop.
        error_page 401 /vault-locked.html;

        # Cloudflare caches .pdf by extension by default. Without this, the
        # first authorised download can populate the edge cache and then be
        # served to somebody who never authenticated — the auth is on the Pi,
        # and a cache hit never reaches the Pi. This is the single most
        # important line in the block.
        add_header Cache-Control "no-store, private" always;
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;

        # add_header does not merge across levels: declaring any add_header
        # here discards every one inherited from the server block, so the
        # three hardening headers have to be restated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # No listing of /vault/files/. This is nginx's default; it is spelled
        # out because here it is the difference between "you need the exact
        # filename" and "here is an index of everything private I own".
        autoindex off;

        # Note the missing `$uri.html` compared to `location /` — pretty URLs
        # are not worth the extra guessing surface on this path.
        try_files $uri $uri/ =404;
    }

    # ---- Caching -------------------------------------------------------
    # HTML must never be cached hard, or an edit takes hours to appear.
    # (This is the same stale-CSS problem that bit us during development.)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # style.css / script.js change often enough that a long cache hurts more
    # than it helps on a site this small. Revalidate every time; nginx still
    # answers 304 when nothing changed, so it costs almost nothing.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Screenshots are immutable in practice — give them a real cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- Hardening -----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Never serve the dev-only files even if one gets copied up by accident.
    location ~* ^/(project-template\.html|README\.md|CLAUDE\.md|claude\.md|classic\.(html|css))$ {
        return 404;
    }

    # Dotfiles (.git, .env, .claude) are never public.
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # The contributions graph is fetched client-side from a third party, so
    # nothing here needs outbound access.
}
