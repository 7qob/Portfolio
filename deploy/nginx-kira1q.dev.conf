# nginx server block for kira1q.dev
#
# Install on the Pi as:
#   /etc/nginx/sites-available/kira1q.dev
# then:
#   sudo ln -sf /etc/nginx/sites-available/kira1q.dev /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is NOT configured here on purpose. Cloudflare Tunnel terminates HTTPS at
# Cloudflare's edge and connects to this server over the loopback interface, so
# a certificate on the Pi would be redundant. Nothing is exposed to the
# internet directly — no port forwarding, no open 80/443 on your router.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name kira1q.dev www.kira1q.dev _;

    root /var/www/kira1q.dev;
    index index.html;

    # Static site: serve the file, otherwise the pretty URL, otherwise 404.
    # No SPA-style fallback to index.html — a typo'd URL should 404, not
    # silently render the home page.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- API -------------------------------------------------------------
    # The login, vault and admin service, in a container listening on
    # loopback. Everything private now lives behind this rather than behind
    # Basic Auth: per-person accounts, revocation, rate limiting and a record
    # of who opened what — none of which one shared password could offer.
    #
    # ^~ is load-bearing, exactly as it was on the old vault block: without
    # it, a regex location below could win for an /api/ path and serve it as
    # a static file instead of proxying it.
    location ^~ /api/ {
        # Optional but recommended, and it needs the zone defined at http
        # level — see deploy/nginx-conf.d-kira1q.conf. This is a second line
        # in front of the service's own rate limiting, and it matters
        # specifically because argon2 is deliberately expensive: 19 MiB per
        # verification means a flood of login attempts is a memory problem on
        # a Pi long before it is a brute-force problem. Comment out the two
        # limit_req lines if you skip that file.
        limit_req      zone=api_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The real client address.
        #
        # cloudflared connects over loopback, so $remote_addr is always
        # 127.0.0.1 and would make the whole login log one meaningless
        # address. Cloudflare overwrites CF-Connecting-IP with the true
        # client address at its edge, so through the tunnel it cannot be
        # forged. (Reaching this nginx directly on the LAN could forge it —
        # that affects log accuracy for LAN requests only, and the tunnel is
        # the only path from the internet.)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;

        # Downloads stream rather than buffering a whole PDF into nginx.
        proxy_buffering off;
        proxy_read_timeout 60s;

        # Nothing under /api/ is ever cacheable — it is all either a session
        # check or somebody's private document.
        add_header Cache-Control "no-store, private" always;
        add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;

        # add_header does not merge across levels: declaring any add_header
        # here discards every one inherited from the server block, so the
        # three hardening headers have to be restated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ---- Vault page ------------------------------------------------------
    # No auth here any more, and that is correct rather than a regression:
    # vault/index.html is now an empty shell. It contains no document names,
    # no filenames and no links — script.js asks /api/vault/items for the
    # list, and that endpoint answers only to a session. An unauthenticated
    # visitor who loads this page receives a heading and nothing else.

    # /vault -> /vault/ so the prefix block below always gets the request.
    location = /vault { return 301 /vault/; }

    location ^~ /vault/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Restated for the same add_header inheritance reason as above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        autoindex off;

        # Note the missing `$uri.html` compared to `location /` — pretty URLs
        # are not worth the extra guessing surface on this path.
        try_files $uri $uri/ =404;
    }

    # The documents are NOT under the web root any more. They live in
    # /var/lib/kira1q/vault-files/, mounted read-only into the container, and
    # reach a visitor only as a stream from the API after it has checked the
    # session.
    #
    # This block exists so that a stale copy left behind by an earlier deploy
    # cannot be served by accident. Delete the old directory on the Pi as
    # well — see deploy/README.md — because this is a safety net, not a
    # substitute for the files not being there.
    location ^~ /vault/files/ {
        deny all;
        return 404;
    }

    # ---- Caching -------------------------------------------------------
    # HTML must never be cached hard, or an edit takes hours to appear.
    # (This is the same stale-CSS problem that bit us during development.)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # style.css / script.js change often enough that a long cache hurts more
    # than it helps on a site this small. Revalidate every time; nginx still
    # answers 304 when nothing changed, so it costs almost nothing.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Screenshots are immutable in practice — give them a real cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- Hardening -----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Never serve the dev-only files even if one gets copied up by accident.
    location ~* ^/(project-template\.html|README\.md|CLAUDE\.md|claude\.md|classic\.(html|css))$ {
        return 404;
    }

    # Dotfiles (.git, .env, .claude) are never public.
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # The contributions graph is fetched client-side from a third party, so
    # nothing here needs outbound access.
}
