<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Vault · kiraa1q</title>

  <!-- No Open Graph on purpose: this page should never render a link
       preview in a chat client, and a preview bot fetching it would only
       ever get the 401 anyway. -->

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='.5' y='.5' width='31' height='31' fill='%230e0e0e' stroke='%232a2a2a'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23ff1e2f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../style.css">

  <!-- Apply the saved theme before first paint, so a light-mode visitor
       never sees a dark flash when moving between pages. -->
  <script>
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.add("light");
      }
    } catch (e) {}
  </script>
</head>
<body>

  <!--
    This page lives one directory down, so every shared asset and every nav
    link is prefixed with ../ — that is the only thing that differs from the
    other subpages. It is in this directory precisely so that ONE nginx
    location block (`^~ /vault/`) covers both the listing and the files it
    links to; see deploy/nginx-kira1q.dev.conf.

    The documents themselves are NOT in this repo and must never be. They
    are uploaded straight to /var/www/kira1q.dev/vault/files/ on the Pi.
    Until a file is there, script.js renders its row as unavailable rather
    than as a dead download.
  -->

  <!-- The site's one navigation. Byte-identical on every page except for
       which link carries aria-current, so "where can I go" never depends on
       "where am I". Sticky on mobile — see .site-header in style.css. -->
  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a href="../index.html">Home</a>
      <a href="../projects.html">Projects</a>
      <a href="../about.html">About</a>
      <a href="index.html" aria-current="page">Vault</a>
    </nav>
    <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle dark/bright" aria-pressed="false">
      <span data-theme-icon>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>
  </header>

  <div class="page-head">
    <h1 class="page-head__title" id="page-title">Vault</h1>
    <p class="page-head__lede">Application documents. Password-protected and not indexed — please keep them to yourself.</p>
  </div>

  <main class="page-body" aria-labelledby="page-title">

    <section class="box box--static box--narrow" aria-labelledby="lbl-docs">
      <h2 class="box__label" id="lbl-docs"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Documents</h2>

      <!-- Empty on purpose, and this is the security property, not an
           oversight.

           This list used to be hardcoded here. That meant the page itself
           told anyone who viewed source that a CV and school reports exist
           and what they are called — before they got past the password. The
           rows are now written by script.js from /api/vault/items, which
           answers only to an authenticated session, so an unauthenticated
           visitor receives this page with nothing in it.

           The documents themselves are NOT in this repo and never will be.
           They sit outside the web root at /var/lib/kira1q/vault-files/ and
           are streamed by the API after it checks the session — nginx cannot
           serve them even if a location block is misconfigured. -->
      <ul class="doc-list" id="vault-list" hidden></ul>

      <p class="box__text" id="vault-status">Loading documents…</p>
    </section>

    <p class="note">Not everything is here. If you need a document that isn't listed, <a href="mailto:matti.naef@bwdbern.ch">email me</a> and I'll send it.</p>

  </main>

  <!-- Legal + credit only. Navigation is in the header. -->
  <footer class="site-footer">
    <span class="site-footer__meta">&copy; <span id="year"></span> kiraa1q &middot; v1.0.0</span>
    <a href="../impressum.html">Impressum</a>
    <a href="https://github.com/kiraa1q" target="_blank" rel="noopener">GitHub<svg class="footer-arrow" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></a>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
