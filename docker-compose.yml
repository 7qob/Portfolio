# Runs on the Pi. `docker compose pull && docker compose up -d` after CI has
# published a new image; nothing is ever built here.

services:
  api:
    image: ghcr.io/kiraa1q/portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped

    # Published to loopback ONLY. Without the 127.0.0.1 prefix Docker would
    # bind 0.0.0.0 and — because it writes its own iptables rules — punch
    # straight through the host firewall, putting the API on the LAN. nginx is
    # the only thing that should ever reach it.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_PATH: /data/app.db
      VAULT_FILES_DIR: /vault-files

    volumes:
      # The database. Lives on the host so pulling a new image never touches
      # accounts or logs.
      - /var/lib/kira1q/data:/data

      # The documents, read-only: this service serves them and has no reason
      # to be able to change or delete them.
      - /var/lib/kira1q/vault-files:/vault-files:ro

    # Nothing in here writes outside the two mounts above.
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
